{% extends 'core/base.html' %}{% block content %}<section class="form-page wide"><a class="back" href="{% url 'aula_lista' %}">← Aulas</a><h1>Chamada</h1><p><b>{{ aula.curso }}</b> • {{ aula.tema }} • {{ aula.data|date:'d/m/Y' }}</p><form method="post" class="form-card">{% csrf_token %}<div class="attendance">{% for m,p in dados %}<label><span>{{ m.aluno.nome }}</span><input type="checkbox" name="m_{{ m.id }}" {% if p %}checked{% endif %}><b>Presente</b></label>{% empty %}<p>Não há matrículas ativas nesta oficina.</p>{% endfor %}</div><button class="btn primary">Salvar frequência</button></form></section>{% endblock %}
